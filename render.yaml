# Render Blueprint : site statique de l'association Mu-umin
services:
  - type: web
    name: mu-umin-grands-lacs
    runtime: static
    staticPublishPath: .
    buildCommand: ""
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /releves/*
        name: X-Robots-Tag
        value: noindex
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
