<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Association Mu-umin des pays des Grands Lacs</title>
<meta name="description" content="Association Mu-umin des pays des Grands Lacs, Québec. Une famille pour tous.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Marcellus&family=Noto+Sans+Arabic:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: lake-blue hero with calligraphic basmala, quiet white panels below; one accent (reed gold). */
:root{
  --lake:#0E4C5A; --lake-2:#1F7A86; --water:#D8EAEA; --reed:#2F6B3F;
  --gold:#B8911F; --sand:#E7D38E; --ink:#14262B; --muted:#4F6368; --bg:#F3F7F6; --card:#FFFFFF;
  --line:#CFDCDB; --danger:#9B2C2C; --ok:#2F6B3F; --hero:#0E4C5A; --hero-ink:#CFE3E2; --scrim:rgba(5,20,24,.55);
  --display:"Marcellus","Palatino Linotype",Georgia,serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --arabic:"Amiri","Traditional Arabic","Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --lake:#7CC4CC; --lake-2:#5FB0B9; --water:#16343A; --reed:#7FBF8C;
    --gold:#D9B64A; --ink:#E6EFEE; --muted:#A3B6B8; --bg:#0D1C20; --card:#132A30;
    --line:#26444A; --danger:#E08A8A; --ok:#7FBF8C; --hero:#0A3640; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --lake:#7CC4CC; --lake-2:#5FB0B9; --water:#16343A; --reed:#7FBF8C;
  --gold:#D9B64A; --ink:#E6EFEE; --muted:#A3B6B8; --bg:#0D1C20; --card:#132A30;
  --line:#26444A; --danger:#E08A8A; --ok:#7FBF8C; --hero:#0A3640; color-scheme:dark;
}
html[lang="ar"]{--body:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;--display:"Amiri","Traditional Arabic",serif}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--body)}
a{color:var(--lake-2)}
img{max-width:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.2;margin:0 0 .5em;text-wrap:balance}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-weight:700}
h1{font-size:clamp(2.2rem,6vw,3.6rem)}
h2{font-size:clamp(1.6rem,3.5vw,2.2rem);color:var(--lake)}
h3{font-size:1.25rem}
p{margin:0 0 1em;max-width:68ch}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}

/* Header */
.ticker{position:relative;overflow:hidden;background:var(--hero);color:var(--sand);height:58px;direction:ltr;border-top:1px solid var(--line);border-bottom:1px solid rgba(231,211,142,.3)}
.ticker-move{position:absolute;left:0;top:0;height:100%;display:inline-flex;align-items:center;gap:22px;white-space:nowrap;animation:ticker-ltr 26s linear -11s infinite;will-change:transform}
@media (hover:hover){.ticker:hover .ticker-move{animation-play-state:paused}}
.ticker .ar{font-family:var(--arabic);font-size:2rem;line-height:1;direction:rtl;color:var(--sand)}
.ticker .tr{font-style:italic;font-size:1.02rem;color:var(--hero-ink)}
@keyframes ticker-ltr{from{transform:translateX(-100%)}to{transform:translateX(100vw)}}
@media (max-width:520px){.ticker{height:50px}.ticker .ar{font-size:1.6rem}.ticker .tr{font-size:.92rem}}
@media (prefers-reduced-motion:reduce){.ticker-move{position:static;animation:none;width:100%;justify-content:center;flex-wrap:wrap;white-space:normal;text-align:center;gap:4px 16px}.ticker{height:auto;min-height:58px;padding-block:6px;display:flex;align-items:center}}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card)}
.bar{display:flex;align-items:center;gap:12px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand svg{flex:none}
.brand b{font-family:"Marcellus",Georgia,serif;font-weight:400;font-size:1.2rem;line-height:1.1;display:block}
.brand small{color:var(--muted);font-size:.8rem}
.lang{margin-inline-start:auto;display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px}
.lang button{border:0;background:none;color:var(--ink);font:600 .85rem var(--body);padding:5px 9px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--lake);color:var(--card)}
.lang button[lang="ar"]{font-family:"Noto Sans Arabic",sans-serif}
nav.main{display:flex;gap:2px;flex-wrap:wrap;width:100%;padding-bottom:8px}
nav.main a{padding:7px 10px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:.95rem}
nav.main a:hover{background:var(--water)}
nav.main a[aria-current="page"]{background:var(--lake);color:var(--card)}
.menu-btn{display:none}
@media (max-width:980px){
  .menu-btn{display:inline-flex}
  nav.main{display:none;position:absolute;inset-inline:0;top:100%;background:var(--card);border-bottom:1px solid var(--line);flex-direction:column;padding:8px 20px 16px}
  nav.main.open{display:flex}
}
@media (max-width:520px){.brand small{display:none}.lang button{padding:5px 7px}}

/* Buttons & forms */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--lake);background:var(--lake);color:var(--card);padding:10px 18px;border-radius:8px;font:600 1rem var(--body);cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--lake)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1405}
.btn.small{padding:6px 12px;font-size:.9rem}
label{display:block;font-weight:600;font-size:.92rem;margin:0 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:1rem var(--body)}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
.check{display:flex;gap:8px;align-items:center;font-weight:400}
.check input{width:auto}
.checks{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:14px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.seg input{position:absolute;opacity:0;width:1px}
.seg label{margin:0;padding:8px 14px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-weight:400}
.seg input:checked+label{background:var(--lake);color:var(--card);border-color:var(--lake)}
.seg input:focus-visible+label{outline:3px solid var(--gold)}

/* Layout pieces */
section.page{display:none;padding-block:40px 64px}
section.page.active{display:block}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;min-width:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px}
.lead{font-size:1.15rem;color:var(--muted)}
.tag{display:inline-block;font-size:.8rem;padding:2px 10px;border-radius:999px;background:var(--water);color:var(--lake)}
.tag.past{background:transparent;border:1px solid var(--line);color:var(--muted)}
.muted{color:var(--muted)}
.note{border-inline-start:4px solid var(--gold);background:var(--card);padding:12px 16px;border-radius:8px;margin:16px 0;font-size:.95rem}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;font-size:.9rem;color:var(--muted)}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
#prayerTable td:first-child{white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;font:600 1rem var(--body);color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--lake);border-bottom-color:var(--lake)}

/* Hero */
.hero{background:var(--hero);color:#F1F7F6;position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;padding-block:48px 120px;position:relative;z-index:1}
.hero .wrap>*{min-width:0}
.hero-main{align-self:center}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;padding-bottom:100px}}
.st-desc{min-width:170px}
.hero h1{color:#fff;margin-top:6px}
.hero p.lead{color:var(--hero-ink)}
.hero .btn{background:var(--sand);border-color:var(--sand);color:#14262B}
.hero .btn.ghost{background:transparent;color:#fff;border-color:#9CC7C9}
.waves{position:absolute;left:0;right:0;bottom:0;width:100%;height:110px}
.prayer-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:20px}
.prayer-card h3{color:#fff;margin-bottom:2px}
.prayer-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.14);font-variant-numeric:tabular-nums;color:#F1F7F6}
.prayer-row.next{color:var(--sand);font-weight:700}
.prayer-row small{font-family:var(--arabic);margin-inline-start:8px;opacity:.8;font-size:1rem}
.countdown{margin:12px 0;font-size:.95rem;color:var(--hero-ink)}
.prayer-card .btn{font-size:.9rem;padding:6px 12px}

.countries{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0;padding:0;list-style:none}
.countries li{padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card)}

/* Lists */
.item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item>div:last-child{min-width:0}
.date{flex:none;width:64px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 0;background:var(--bg);line-height:1.15}
.date b{display:block;font-family:"Marcellus",Georgia,serif;font-size:1.5rem;font-weight:400;color:var(--lake)}
.date small{font-size:.75rem;color:var(--muted)}
.item h3{margin-bottom:4px}
.item p{margin:0 0 6px;color:var(--muted);font-size:.96rem}
.person{display:flex;gap:14px;align-items:center}
.avatar{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--water);color:var(--lake);font-family:"Marcellus",Georgia,serif;font-size:1.3rem}
.progress{height:12px;background:var(--water);border-radius:999px;overflow:hidden;margin:10px 0 6px}
.progress i{display:block;height:100%;background:var(--reed);border-radius:999px;transition:width .6s}
.big{font-family:"Marcellus",Georgia,serif;font-size:1.6rem;color:var(--lake);font-variant-numeric:tabular-nums}
.lock{text-align:center;padding:40px 22px}
.lock p{margin-inline:auto}

/* Statements */
.st-row{display:grid;grid-template-columns:1.2fr repeat(4,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.st-row.head{font-size:.85rem;color:var(--muted);font-weight:600}
.st-row span.n{text-align:end}
.st-row b{font-weight:600}
@media (max-width:760px){
  .st-row{grid-template-columns:1fr 1fr}
  .st-row.head{display:none}
  .st-row span.n{text-align:start}
  .st-row span[data-l]::before{content:attr(data-l);display:block;font-size:.78rem;color:var(--muted)}
  .st-row .btn{grid-column:1/-1;justify-self:start}
}
.pos{color:var(--ok)} .neg{color:var(--danger)}

/* Chat */
.chat{display:flex;flex-direction:column;height:420px}
.msgs{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:8px;border:1px solid var(--line)}
.msg{max-width:78%;padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--water)}
.msg small{display:block;color:var(--muted);font-size:.78rem}
.chat form{display:flex;gap:8px;margin-top:10px}
.audio-list{list-style:none;margin:0;padding:0}
.audio-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.arname{font-family:var(--arabic);font-size:1.3rem}

/* Dialog, toast, adhan bar */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;max-width:640px;width:calc(100% - 32px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:var(--scrim)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg-head h3{margin:0}
.dlg-body{padding:20px;max-height:75vh;overflow:auto}
.x{border:0;background:none;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:10px;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw}
.toast.show{opacity:1}
.adhan-bar{position:fixed;inset-inline:0;bottom:0;z-index:60;background:var(--hero);color:#fff;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;border-top:3px solid var(--sand)}
.adhan-bar b{font-family:var(--display);font-size:1.3rem;font-weight:400;color:var(--sand)}
.adhan-bar .btn{background:var(--sand);border-color:var(--sand);color:#14262B}

footer{background:var(--card);border-top:1px solid var(--line);padding-block:32px;font-size:.92rem;color:var(--muted)}
footer .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
footer b{color:var(--ink);font-family:var(--display);font-weight:400;font-size:1.1rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  </div>
  <div class="wrap bar">
    <a class="brand" href="#accueil">
      <svg width="42" height="42" viewBox="0 0 42 42" aria-hidden="true">
        <circle cx="21" cy="21" r="20" fill="#0E4C5A"/>
        <path d="M25 11.83A10 10 0 1 0 25 30.17A9.5 9.5 0 1 1 25 11.83z" fill="#E7D38E"/>
        <path d="M7 28c4-3 8-3 12 0s8 3 12 0 6-2 5-1" stroke="#9CC7C9" stroke-width="2" fill="none"/>
      </svg>
      <span><b>Mu-umin</b><small data-i="brand_sub"></small></span>
    </a>
    <div class="lang" role="group" id="langSwitch">
      <button type="button" data-lang="fr" lang="fr">FR</button>
      <button type="button" data-lang="en" lang="en">EN</button>
      <button type="button" data-lang="sw" lang="sw">SW</button>
      <button type="button" data-lang="ar" lang="ar">عربي</button>
    </div>
    <button class="btn ghost small menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="mainNav" data-i="menu"></button>
    <nav class="main" id="mainNav">
      <a href="#accueil" data-i="nav_home"></a>
      <a href="#activites" data-i="nav_act"></a>
      <a href="#registres" data-i="nav_reg"></a>
      <a href="#coran" data-i="nav_quran"></a>
      <a href="#projets" data-i="nav_proj"></a>
      <a href="#dons" data-i="nav_don"></a>
      <a href="#priere" data-i="nav_prayer"></a>
      <a href="#ecouter" data-i="nav_listen"></a>
      <a href="#responsables" data-i="nav_leaders"></a>
      <a href="#membres" id="navMember"></a>
    </nav>
  </div>
  <div class="ticker" role="marquee" aria-live="off">
    <div class="ticker-move">
      <span class="ar" lang="ar">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</span>
      <span class="tr" id="basmalaTr" data-i="basmala_tr"></span>
    </div>
</header>

<main>
<section class="page" id="p-accueil" style="padding-top:0">
  <div class="hero">
    <div class="wrap">
      <div class="hero-main">
        <h1 data-i="hero_title"></h1>
        <p class="lead" data-i="hero_lead"></p>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:20px">
          <a class="btn" href="#adhesion" data-i="btn_join"></a>
          <a class="btn ghost" href="#dons" data-i="btn_support"></a>
        </div>
      </div>
      <aside class="prayer-card" aria-live="polite">
        <h3 data-i="prayer_today"></h3>
        <p style="color:#9CC7C9;margin:0 0 10px;font-size:.9rem" id="heroDate"></p>
        <div id="heroPrayers"></div>
        <p class="countdown" id="countdown"></p>
        <button class="btn" type="button" id="heroAdhan"></button>
      </aside>
    </div>
    <svg class="waves" viewBox="0 0 1200 110" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 40 C150 10 300 70 450 40 S750 10 900 40 1100 70 1200 40 V110 H0z" fill="#1F7A86" opacity=".35"/>
      <path d="M0 65 C200 35 350 95 550 65 S850 35 1000 65 1150 90 1200 70 V110 H0z" fill="#1F7A86" opacity=".55"/>
      <path d="M0 88 C180 70 380 108 600 88 S950 70 1200 90 V110 H0z" fill="var(--bg)"/>
    </svg>
  </div>

  <div class="wrap" style="padding-top:32px">
    <div class="cols">
      <div>
        <h2 data-i="about_title"></h2>
        <p data-i="about_text"></p>
        <h3 data-i="countries_label" style="margin-top:18px"></h3>
        <ul class="countries" id="countryList"></ul>
      </div>
      <div class="panel" style="align-self:start">
        <h3 data-i="find_title"></h3>
        <p class="muted" data-i="find_public"></p>
        <p class="muted" style="margin:0" data-i="find_members"></p>
      </div>
    </div>
    <h2 style="margin-top:40px" data-i="upcoming_title"></h2>
    <div class="panel" id="homeUpcoming"></div>
  </div>
</section>

<section class="page" id="p-activites">
  <div class="wrap">
    <h2 data-i="act_title"></h2>
    <p class="lead" data-i="act_lead"></p>
    <div class="tabs" role="tablist" data-tabs="act">
      <button role="tab" aria-selected="true" data-val="evenements" data-i="tab_events"></button>
      <button role="tab" aria-selected="false" data-val="visites" data-i="tab_visits"></button>
    </div>
    <div class="cols">
      <div class="panel"><h3 data-i="upcoming"></h3><div id="actUpcoming"></div></div>
      <div class="panel"><h3 data-i="past"></h3><div id="actPast"></div></div>
    </div>
  </div>
</section>

<section class="page" id="p-registres">
  <div class="wrap">
    <h2 data-i="reg_title"></h2>
    <p class="lead" data-i="reg_lead"></p>
    <div class="tabs" role="tablist" data-tabs="reg">
      <button role="tab" aria-selected="true" data-val="naissances" data-i="tab_births"></button>
      <button role="tab" aria-selected="false" data-val="arrivants" data-i="tab_arr"></button>
      <button role="tab" aria-selected="false" data-val="deces" data-i="tab_deaths"></button>
    </div>
    <div class="panel">
      <p id="regIntro" class="muted"></p>
      <div class="scroll"><table id="regTable"></table></div>
      <div id="regAdd" style="margin-top:16px"></div>
    </div>
  </div>
</section>

<section class="page" id="p-coran">
  <div class="wrap">
    <h2 data-i="quran_title"></h2>
    <p class="lead" data-i="quran_lead"></p>
    <div class="cols">
      <div class="panel">
        <h3 data-i="schedule"></h3>
        <div class="item"><div><h3 data-i="c_kids_t"></h3><p data-i="c_kids_d"></p></div></div>
        <div class="item"><div><h3 data-i="c_sis_t"></h3><p data-i="c_sis_d"></p></div></div>
        <div class="item"><div><h3 data-i="c_bro_t"></h3><p data-i="c_bro_d"></p></div></div>
        <p class="muted" style="margin-top:12px" data-i="c_online_note"></p>
      </div>
      <form class="panel" id="courseForm">
        <h3 data-i="register"></h3>
        <label data-i="participant"></label>
        <div class="seg">
          <input type="radio" name="age" id="c-adulte" value="adult" checked><label for="c-adulte" data-i="adult"></label>
          <input type="radio" name="age" id="c-enfant" value="child"><label for="c-enfant" data-i="child"></label>
        </div>
        <label data-i="format"></label>
        <div class="seg">
          <input type="radio" name="mode" id="c-ligne" value="online" checked><label for="c-ligne" data-i="online"></label>
          <input type="radio" name="mode" id="c-pres" value="inperson"><label for="c-pres" data-i="inperson"></label>

/* ===================== Heures de prière ===================== */
const dtr=d=>d*Math.PI/180,rtd=r=>r*180/Math.PI;
const sin=d=>Math.sin(dtr(d)),cos=d=>Math.cos(dtr(d)),tan=d=>Math.tan(dtr(d));
const asin=x=>rtd(Math.asin(x)),acos=x=>rtd(Math.acos(x)),atan2=(y,x)=>rtd(Math.atan2(y,x)),acot=x=>rtd(Math.atan(1/x));
const fix=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a};
function julian(y,m,d){if(m<=2){y--;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPos(jd){const D=jd-2451545,g=fix(357.529+.98560028*D,360),q=fix(280.459+.98564736*D,360),Lg=fix(q+1.915*sin(g)+.02*sin(2*g),360),e=23.439-.00000036*D;
  const RA=fix(atan2(cos(e)*sin(Lg),cos(Lg))/15,24);return{decl:asin(sin(e)*sin(Lg)),eqt:q/15-RA}}
function prayerTimes(date,asrF){
  const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();const jd=julian(y,m,d)-QC.lng/(15*24);
  const mid=x=>fix(12-sunPos(jd+x).eqt,24);
  const ang=(a,x,ccw)=>{const {decl}=sunPos(jd+x),noon=mid(x);const T=acos((-sin(a)-sin(decl)*sin(QC.lat))/(cos(decl)*cos(QC.lat)))/15;return noon+(ccw?-T:T)};
  const asr=(f,x)=>{const {decl}=sunPos(jd+x);return ang(-acot(f+tan(Math.abs(QC.lat-decl))),x)};
  const h={fajr:ang(15,5/24,true),lever:ang(.833,6/24,true),dhuhr:mid(12/24)+2/60,asr:asr(asrF,13/24),maghrib:ang(.833,18/24),isha:ang(15,18/24)};
  const out={};for(const k in h){out[k]=new Date(Date.UTC(y,m-1,d)+(h[k]-QC.lng/15)*3600000)}return out;
}
const fmtT=dt=>isNaN(dt)?"—":dt.toLocaleTimeString(LOC[lang],{hour:"2-digit",minute:"2-digit",timeZone:QC.tz});
const PR=[["fajr","الفجر"],["lever","الشروق"],["dhuhr","الظهر"],["asr","العصر"],["maghrib","المغرب"],["isha","العشاء"]];

function qcToday(){const [y,m,d]=qcDateStr().split("-").map(Number);return new Date(y,m-1,d)}
const asrF=()=>+$("#asrMethod").value||1;
function renderHeroPrayers(){
  const tm=prayerTimes(qcToday(),asrF());const now=new Date();
  const next=PR.find(([k])=>k!=="lever"&&tm[k]>now);
  $("#heroDate").textContent=t("city")+", "+now.toLocaleDateString(LOC[lang],{weekday:"long",day:"numeric",month:"long",timeZone:QC.tz});
  $("#heroPrayers").innerHTML=PR.map(([k,a])=>`<div class="prayer-row${next&&next[0]===k?" next":""}"><span>${pn(k)}${lang==="ar"?"":`<small lang="ar">${a}</small>`}</span><span>${fmtT(tm[k])}</span></div>`).join("");
  if(next){const mins=Math.max(0,Math.round((tm[next[0]]-now)/60000));$("#countdown").textContent=t("next_prayer",pn(next[0]),Math.floor(mins/60),mins%60)}
  else $("#countdown").textContent=t("tomorrow_fajr")+fmtT(prayerTimes(new Date(qcToday().getTime()+864e5),asrF()).fajr);
}

const ADHAN_SRC="adhan.mp3"; /* déposez votre enregistrement d'adhan à côté de index.html */
const adhan={on:store.get("adhan_on",false),which:store.get("adhan_which",FIVE),audio:null,ctx:null,fired:new Set(store.get("adhan_fired",[]))};
function ensureAudioCtx(){try{adhan.ctx=adhan.ctx||new (window.AudioContext||window.webkitAudioContext)();adhan.ctx.resume()}catch(e){}}
function chime(){ /* son de secours si adhan.mp3 est absent */
  ensureAudioCtx();const c=adhan.ctx;if(!c)return;const now=c.currentTime;
  [[0,523.25],[0.9,659.25],[1.8,783.99],[3.2,659.25],[4.1,523.25]].forEach(([at,f])=>{
    const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=f;
    g.gain.setValueAtTime(0,now+at);g.gain.linearRampToValueAtTime(.22,now+at+.08);g.gain.exponentialRampToValueAtTime(.001,now+at+1.6);
    o.connect(g).connect(c.destination);o.start(now+at);o.stop(now+at+1.7)});
}
function playAdhan(){
  stopAdhanSound();
  const a=new Audio(ADHAN_SRC);adhan.audio=a;
  a.play().catch(()=>{adhan.audio=null;chime()});
  a.onerror=()=>{if(adhan.audio===a){adhan.audio=null;chime()}};
  a.onended=()=>{$("#adhanBar").hidden=true};
}
function stopAdhanSound(){if(adhan.audio){adhan.audio.pause();adhan.audio=null}}
function fireAdhan(k){
  $("#adhanBarTitle").textContent=t("adhan_now",pn(k));$("#adhanBarBody").textContent=t("adhan_body");$("#adhanStop").textContent=t("adhan_stop");
  $("#adhanBar").hidden=false;playAdhan();
  try{if("Notification" in window&&Notification.permission==="granted")new Notification(t("adhan_now",pn(k)),{body:t("adhan_body"),tag:"adhan-"+k,lang})}catch(e){}
}
$("#adhanStop").onclick=()=>{stopAdhanSound();$("#adhanBar").hidden=true};
function checkAdhan(){
  if(!adhan.on)return;const tm=prayerTimes(qcToday(),asrF()),now=Date.now(),day=qcDateStr();
  for(const k of adhan.which){const due=tm[k].getTime(),key=day+"-"+k;
    if(now>=due&&now-due<120000&&!adhan.fired.has(key)){adhan.fired.add(key);store.set("adhan_fired",[...adhan.fired].slice(-20));fireAdhan(k)}}
}
async function setAdhan(on){
  adhan.on=on;store.set("adhan_on",on);
  if(on){ensureAudioCtx();
    let perm="unsupported";
    try{if("Notification" in window){perm=Notification.permission==="default"?await Notification.requestPermission():Notification.permission}}catch(e){perm="denied"}
    adhan.perm=perm;toast(perm==="granted"?t("adhan_on"):t("adhan_nonotif"));
    /* ne pas rejouer une prière déjà passée aujourd'hui */
    const tm=prayerTimes(qcToday(),asrF()),day=qcDateStr();FIVE.forEach(k=>{if(tm[k].getTime()<Date.now()-120000)adhan.fired.add(day+"-"+k)});
  }else toast(t("adhan_off"));
  renderAdhanUI();
}
function renderAdhanUI(){
  const label=adhan.on?t("adhan_disable"):t("adhan_enable");
  $("#adhanToggle").textContent=label;$("#heroAdhan").textContent=label;
  $("#adhanToggle").classList.toggle("ghost",adhan.on);
  const perm=("Notification" in window)?Notification.permission:"unsupported";
  $("#adhanState").textContent=adhan.on?(perm==="granted"?t("adhan_on"):t("adhan_nonotif")):t("adhan_off");
  $("#adhanPrayers").innerHTML=FIVE.map(k=>`<label class="check"><input type="checkbox" id="ad-${k}" value="${k}" ${adhan.which.includes(k)?"checked":""}> ${pn(k)}</label>`).join("");
  $("#adhanPrayers").querySelectorAll("input").forEach(i=>i.onchange=()=>{adhan.which=[...$("#adhanPrayers").querySelectorAll("input:checked")].map(x=>x.value);store.set("adhan_which",adhan.which)});
}
$("#adhanToggle").onclick=()=>setAdhan(!adhan.on);
$("#heroAdhan").onclick=()=>setAdhan(!adhan.on);
$("#adhanTest").onclick=()=>{ensureAudioCtx();const tm=prayerTimes(qcToday(),asrF());const k=(PR.find(([x])=>x!=="lever"&&tm[x]>new Date())||["fajr"])[0];fireAdhan(k)};

/* ===================== Relevés bancaires ===================== */
function buildStatements(){
  let bal=DATA.releves[0].ouverture;
  return DATA.releves.map(r=>{
    const lines=[...DATA.contributions.filter(c=>c.date.startsWith(r.mois)).map(c=>({...c,montant:+c.montant})),
                 ...DATA.depenses.filter(c=>c.date.startsWith(r.mois)).map(c=>({...c,montant:-c.montant})),
                 ...r.extra].sort((a,b)=>a.date.localeCompare(b.date));
    const open=bal;let dep=0,wd=0;
    lines.forEach(l=>{bal+=l.montant;l.solde=bal;l.montant>=0?dep+=l.montant:wd-=l.montant});
    return {...r,open,dep,wd,close:bal,lines};
  });
}
function showStatement(i){
  const s=buildStatements()[i];
  openDlg(t("st_of",monthName(s.mois)),`<p class="muted" style="margin-bottom:6px">${t("account")}</p>
  <div class="scroll"><table><thead><tr><th>${t("date")}</th><th>${t("desc")}</th><th class="num">${t("deposits")}</th><th class="num">${t("withdrawals")}</th><th class="num">${t("running")}</th></tr></thead><tbody>
  <tr><td></td><td><b>${t("opening")}</b></td><td></td><td></td><td class="num"><b>${money2(s.open)}</b></td></tr>
  ${s.lines.map(l=>`<tr><td style="white-space:nowrap">${new Date(l.date+"T12:00").toLocaleDateString(LOC[lang],{day:"numeric",month:"short"})}</td><td class="st-desc">${esc(lineLabel(l))}</td><td class="num pos">${l.montant>0?money2(l.montant):""}</td><td class="num neg">${l.montant<0?money2(-l.montant):""}</td><td class="num">${money2(l.solde)}</td></tr>`).join("")}
  <tr><td></td><td><b>${t("closing")}</b></td><td class="num"><b>${money2(s.dep)}</b></td><td class="num"><b>${money2(s.wd)}</b></td><td class="num"><b>${money2(s.close)}</b></td></tr>
  </tbody></table></div>${s.pdf?`<p style="margin-top:14px"><a class="btn ghost small" href="${esc(s.pdf)}" target="_blank" rel="noopener">${t("bank_pdf")}</a></p>`:""}`);
}
